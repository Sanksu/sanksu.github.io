# ============================================================
# Staging Auto-Merge, Build & Sync
#
# 工作流说明：
#   1. 同步 main 分支到 staging（确保 staging 基于最新 main）
#   2. 自动合并 staging 上所有已通过审查且无冲突的 PR
#   3. 合并后执行项目构建（编译 + 类型检查 + 静态生成）
#   4. 构建通过后，将 staging 推送回 main 分支
#   5. 任意步骤失败时自动创建 Issue 通知，提供清晰日志
#
# 触发条件：
#   - pull_request_review: PR 获得审批时触发
#   - workflow_dispatch:   手动触发
#
# 并发控制：
#   同一时间只允许一个 staging-sync 实例运行，防止竞态。
# ============================================================

name: Staging Auto-Merge, Build & Sync

on:
  pull_request_review:
    types: [submitted]
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: staging-sync
  cancel-in-progress: false

env:
  NODE_VERSION: '26'

jobs:
  process-staging:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      # ---------------------------------------------------
      # Step 1: 过滤非 approval 的 review 事件
      # ---------------------------------------------------
      - name: Skip non-approval review events
        id: check-trigger
        if: github.event_name == 'pull_request_review'
        run: |
          STATE="${{ github.event.review.state }}"
          echo "Review state: $STATE"
          if [ "$STATE" != "approved" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping -- review is not an approval."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "PR #${{ github.event.pull_request.number }} approved. Proceeding."
          fi

      # ---------------------------------------------------
      # Step 2: 检出 staging 分支
      # ---------------------------------------------------
      - name: Checkout staging branch
        if: steps.check-trigger.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
          token: ${{ secrets.GH_PAGES_TOKEN || secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------
      # Step 3: 同步 main 到 staging
      #
      # 确保 staging 始终基于最新的 main，避免 PR 基于
      # 过期版本。合并后 push 到远端。
      # ---------------------------------------------------
      - name: Sync main into staging
        if: steps.check-trigger.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Syncing main into staging ==="
          git fetch origin main
          if git merge origin/main --no-edit; then
            git push origin staging
            echo "[OK] staging is now based on latest main"
          else
            echo "[FAIL] Merge conflict between staging and main. Aborting."
            git merge --abort
            exit 1
          fi

      # ---------------------------------------------------
      # Step 4: 设置 Node.js
      # ---------------------------------------------------
      - name: Setup Node.js
        if: steps.check-trigger.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # ---------------------------------------------------
      # Step 5: 自动合并所有可合并的 PR
      #
      # 条件：
      #   - 至少有 1 个 APPROVED review
      #   - mergeable 状态为 MERGEABLE（无冲突）
      #
      # 排序：按创建时间升序（先合并最早的 PR，减少冲突概率）
      # 动作：squash merge + 删除源分支
      # ---------------------------------------------------
      - name: Auto-merge approved PRs into staging
        if: steps.check-trigger.outputs.skip != 'true'
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "==> Checking open PRs targeting staging..."
          PRS=$(gh pr list --base staging --state open \
            --json number,title,reviews,mergeable,headRefName,createdAt \
            --jq 'sort_by(.createdAt)')
          TOTAL=$(echo "$PRS" | jq 'length')
          echo "Found $TOTAL open PR(s)."
          echo ""

          if [ "$TOTAL" -eq 0 ]; then
            echo "merged=0" >> "$GITHUB_OUTPUT"
            echo "failed=0" >> "$GITHUB_OUTPUT"
            echo "skipped=0" >> "$GITHUB_OUTPUT"
            echo "pr_count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MERGED=0
          FAILED=0
          SKIPPED=0
          SUMMARY="| # | Title | Status |\n|---|---|---|"

          for i in $(seq 0 $((TOTAL - 1))); do
            PR=$(echo "$PRS" | jq ".[$i]")
            NUM=$(echo "$PR" | jq -r '.number')
            TITLE=$(echo "$PR" | jq -r '.title')
            MERGEABLE=$(echo "$PR" | jq -r '.mergeable')
            APPROVED=$(echo "$PR" | jq '[.reviews[] | select(.state == "APPROVED")] | length')

            echo "--- PR #$NUM: $TITLE ---"

            if [ "$MERGEABLE" != "MERGEABLE" ]; then
              echo "  [SKIP] Not mergeable (state: $MERGEABLE)"
              SKIPPED=$((SKIPPED + 1))
              SUMMARY="$SUMMARY\n| #$NUM | $TITLE | Not mergeable |"
              continue
            fi

            if [ "$APPROVED" -eq 0 ]; then
              echo "  [SKIP] No approved review"
              SKIPPED=$((SKIPPED + 1))
              SUMMARY="$SUMMARY\n| #$NUM | $TITLE | Pending review |"
              continue
            fi

            echo "  [MERGE] Approved and mergeable. Merging..."
            if gh pr merge "$NUM" --squash --delete-branch; then
              echo "  [OK] PR #$NUM merged successfully"
              MERGED=$((MERGED + 1))
              SUMMARY="$SUMMARY\n| #$NUM | $TITLE | Merged |"
            else
              echo "  [FAIL] PR #$NUM merge failed"
              FAILED=$((FAILED + 1))
              SUMMARY="$SUMMARY\n| #$NUM | $TITLE | Merge failed |"
            fi
          done

          echo "merged=$MERGED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "pr_count=$TOTAL" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------
      # Step 6: 拉取所有远端变更到本地
      #
      # 包含：main->staging 合并 + PR squash merge
      # ---------------------------------------------------
      - name: Pull all latest changes
        if: steps.check-trigger.outputs.skip != 'true'
        run: |
          echo "=== Pulling latest staging ==="
          git pull origin staging --rebase
          echo "[OK] Local staging up to date"

      # ---------------------------------------------------
      # Step 7: 安装依赖
      #
      # 使用 npm install 而非 npm ci，因为 dependabot 更新后
      # lock 文件可能不一致，npm ci 会导致安装不完整。
      # ---------------------------------------------------
      - name: Install dependencies
        if: steps.check-trigger.outputs.skip != 'true'
        run: npm install

      # ---------------------------------------------------
      # Step 8: 构建项目
      #
      # 包括：Feed 生成 + Next.js 编译 + TypeScript 检查
      # ---------------------------------------------------
      - name: Build project
        if: steps.check-trigger.outputs.skip != 'true'
        id: build
        run: |
          echo "=== Build started ==="
          if npm run build; then
            echo "[OK] Build succeeded"
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "[FAIL] Build failed"
            echo "success=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # ---------------------------------------------------
      # Step 9: 构建失败 -> 创建 Issue 告警
      #
      # 告警内容：失败时间、分支、PR 合并汇总、日志链接
      # ---------------------------------------------------
      - name: Create issue on build failure
        if: always() && steps.build.outputs.success == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const now = new Date().toISOString().split('T')[0];
            const title = '[Staging] Build failed - ' + now;
            const body = [
              '## Build Failure',
              '',
              '| Field | Value |',
              '|---|---|',
              '| **Workflow** | `${{ github.workflow }}` |',
              '| **Run** | [#${{ github.run_id }}](' + runUrl + ') |',
              '| **Branch** | `staging` |',
              '| **Event** | `${{ github.event_name }}` |',
              '| **Date** | ' + now + ' |',
              '',
              '### PRs merged in this run',
              '',
              ('${{ steps.merge.outputs.summary || 'No PRs merged' }}').replace(/\\n/g, '\n'),
              '',
              'Check the [workflow logs](' + runUrl + ') for details.',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              labels: ['automation', 'bug'],
              body: body,
            });

      # ---------------------------------------------------
      # Step 10: 构建通过 -> 同步 staging 到 main
      #
      # 注意：使用 GH_PAGES_TOKEN 而非 GITHUB_TOKEN，
      # 因为 GITHUB_TOKEN 无法触发其他 workflow（deploy.yml）。
      # GH_PAGES_TOKEN 需在仓库 Secrets 中配置。
      # ---------------------------------------------------
      - name: Sync staging to main
        if: steps.build.outputs.success == 'true' && steps.check-trigger.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Syncing staging to main ==="

          git fetch origin main
          git checkout main
          git rebase origin/main

          if git merge origin/staging --no-edit; then
            git push origin main
            echo "[OK] main branch updated with staging changes"
          else
            echo "[FAIL] Merge conflict detected. Aborting sync."
            git merge --abort
            exit 1
          fi

      # ---------------------------------------------------
      # Step 11: 同步失败 -> 创建 Issue 告警
      # ---------------------------------------------------
      - name: Create issue on sync failure
        if: failure() && steps.build.outputs.success == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const now = new Date().toISOString().split('T')[0];
            const title = '[Staging] Sync to main failed - ' + now;
            const body = [
              '## Sync Failure',
              '',
              'Build passed but sync to `main` failed.',
              '',
              '| Field | Value |',
              '|---|---|',
              '| **Workflow** | `${{ github.workflow }}` |',
              '| **Run** | [#${{ github.run_id }}](' + runUrl + ') |',
              '| **Branch** | `staging` -> `main` |',
              '| **Date** | ' + now + ' |',
              '',
              '**Possible cause:** Merge conflict between `staging` and `main`.',
              '',
              'Resolve manually:',
              '1. `git checkout main && git pull`',
              '2. `git merge origin/staging`',
              '3. Fix conflicts, commit, push',
              '',
              'See [workflow logs](' + runUrl + ') for details.',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              labels: ['automation', 'bug'],
              body: body,
            });

      # ---------------------------------------------------
      # Step 12: 运行摘要
      # ---------------------------------------------------
      - name: Run summary
        if: always() && steps.check-trigger.outputs.skip != 'true'
        run: |
          echo ""
          echo "========================================"
          echo "      Staging Sync Run Summary"
          echo "========================================"
          echo ""
          echo "  PRs merged:   ${{ steps.merge.outputs.merged || '0' }}"
          echo "  PRs failed:   ${{ steps.merge.outputs.failed || '0' }}"
          echo "  PRs skipped:  ${{ steps.merge.outputs.skipped || '0' }}"
          echo "  Build:        ${{ steps.build.outputs.success || 'N/A' }}"
          echo "  Sync to main: ${{ steps.build.outputs.success == 'true' && 'triggered' || 'skipped' }}"
          echo ""
          echo "========================================"