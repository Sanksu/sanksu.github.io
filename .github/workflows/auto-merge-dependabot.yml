# ============================================================
# Auto-merge Dependabot PRs
#
# 自动化处理 dependabot[bot] 提交到 main 的 PR：
#   1. 自动 approve
#   2. 启用 auto-merge（等待 CI 通过后合并）
#
# 触发方式：
#   - pull_request_target: dependabot 提 PR 时自动触发
#   - workflow_dispatch:   手动触发，可指定 PR 编号或处理全部
#
# 使用 pull_request_target 确保安全：PR 代码不会
# 在 workflow 上下文中执行，避免注入风险。
# ============================================================

name: Auto-merge Dependabot PRs

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'PR number to process (leave empty to process all open dependabot PRs on main)'
        required: false
        type: number

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge-dependabot:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # ---------------------------------------------------
      # Step 0: 检出仓库
      # ---------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      # ---------------------------------------------------
      # Step 1: 确定要处理的 PR 列表
      # ---------------------------------------------------
      - name: Determine target PRs
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_NUMBER="${{ inputs.pr-number }}"
            if [ -n "$PR_NUMBER" ]; then
              echo "Manual trigger: processing PR #$PR_NUMBER"
              echo "prs=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            else
              echo "Manual trigger: processing all open dependabot PRs on main"
              PRS=$(gh pr list --base main --state open \
                --author "dependabot[bot]" \
                --json number --jq '.[].number' | tr '\n' ' ')
              echo "Found dependabot PRs: $PRS"
              echo "prs=$(echo $PRS)" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Auto trigger by ${{ github.actor }}"
            echo "prs=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------
      # Step 2: 逐个处理 PR（静默，不触发邮件通知）
      # ---------------------------------------------------
      - name: Process each PR
        env:
          PR_LIST: ${{ steps.resolve.outputs.prs }}
        run: |
          if [ -z "$PR_LIST" ]; then
            echo "No PRs to process."
            exit 0
          fi

          for PR in $PR_LIST; do
            echo ""
            echo "--- Processing PR #$PR ---"

            # Approve (suppress notification email)
            APPROVE_OUTPUT=$(gh api \
              -X POST \
              -H "X-GitHub-Non-Notification: 1" \
              "/repos/${{ github.repository }}/pulls/$PR/reviews" \
              -f event="APPROVE" \
              -f body="Auto-approved." 2>&1)
            APPROVE_EXIT=$?
            if [ $APPROVE_EXIT -eq 0 ]; then
              echo "  [OK] Approved PR #$PR (no email sent)"
            else
              echo "  [SKIP] Could not approve PR #$PR: $APPROVE_OUTPUT"
            fi

            # Enable auto-merge (suppress notification email)
            MERGE_OUTPUT=$(gh api \
              -X PUT \
              -H "X-GitHub-Non-Notification: 1" \
              "/repos/${{ github.repository }}/pulls/$PR/merge" \
              -f merge_method="squash" \
              -f auto_merge="true" 2>&1)
            MERGE_EXIT=$?
            if [ $MERGE_EXIT -eq 0 ]; then
              echo "  [OK] Auto-merge enabled for PR #$PR (no email sent)"
            else
              echo "  [WARN] Could not enable auto-merge for PR #$PR"
              echo "  [DEBUG] API response: $MERGE_OUTPUT"
            fi
          done

          echo ""
          echo "Done processing all PRs."