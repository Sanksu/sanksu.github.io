# ============================================================
# Auto-merge Dependabot PRs
#
# 当 dependabot[bot] 向 main 分支提交 PR 时：
#   1. 自动 approve（赋予信任标签）
#   2. 启用 auto-merge（PR 实际合并等待 CI 通过后执行）
#
# 使用 pull_request_target 确保安全：PR 代码不会
# 在 workflow 上下文中执行，避免注入风险。
# ============================================================

name: Auto-merge Dependabot PRs

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge-dependabot:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check PR author
        run: |
          echo "PR #${{ github.event.pull_request.number }} by ${{ github.actor }}"
          echo "Title: ${{ github.event.pull_request.title }}"

      - name: Auto-approve dependabot PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review "${{ github.event.pull_request.number }}" --approve \
            --body "Dependabot PR auto-approved. Merge will proceed after CI passes."

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" --auto --squash
          echo "[OK] Auto-merge enabled for PR #${{ github.event.pull_request.number }}"